[project]
name = "dataset-ch-cha-flux-product"
version = "0.1.0"
description = "Dataset for grassland CH-CHA"
authors = [
    { name = "Lukas Hörtnagl", email = "lukas.hoertnagl@usys.ethz.ch" }
]
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "jupyterlab (>=4.3.5,<5.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "jupyter-book (>=1.0.4.post1,<2.0.0)",
    "ghp-import (>=2.1.0,<3.0.0)"
]

[poetry.group.dev.dependencies]
diive = { path = "../../21 - DIIVE/diive", develop = true }
dbc-influxdb = { path = "../../22 - POET/dbc-influxdb", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
